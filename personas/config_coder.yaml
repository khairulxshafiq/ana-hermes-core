model:
  aliases:
    coding:
      provider: custom:google-paid
      model: gemini-3.8-flash
    reason:
      provider: custom:google-paid
      model: gemini-3.8-flash
    easy:
      provider: custom:google-paid
      model: gemini-3.8-flash
    bulk:
      provider: custom:google-paid
      model: gemini-3.8-flash
    copywrite:
      provider: custom:google-paid
      model: gemini-3.8-flash
    writer:
      provider: custom:google-paid
      model: gemini-3.8-flash
    vision:
      provider: custom:google-paid
      model: gemini-3.8-flash
  default: gemini-3.8-flash
  provider: custom:google-paid
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
fallback_providers:
- provider: openrouter
  model: google/gemini-2.0-flash-exp:free
- provider: openrouter
  model: deepseek/deepseek-chat
- provider: openrouter
  model: meta-llama/llama-3.3-70b-instruct:free
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 30
  reasoning_effort: medium
  verbose: false
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: ddgs
  use_gateway: false
browser:
  inactivity_timeout: 120
  cloud_provider: camofox
  use_gateway: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 1
    same_tool_failure: 1
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 2
    same_tool_failure: 2
    idempotent_no_progress: 2
compression:
  enabled: true
  progress_notices: false
  threshold: 0.35
  target_ratio: 0.2
  protect_last_n: 4
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 12000
  proactive_prune_min_result_chars: 4000
  proactive_prune_min_reclaim_tokens: 2048
  protect_first_n: 2
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
  threshold_tokens_cap: 12000
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  show_cost: true
  skin: tanair
  interim_assistant_messages: true
  platforms:
    telegram:
      busy_ack_detail: false
      tool_progress: false
  background_process_notifications: concise
  busy_ack_detail: true
  cleanup_progress: false
  long_running_notifications: true
  tool_progress: all
dashboard:
  theme: mono
tts:
  use_gateway: false
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 1500
  user_char_limit: 1000
  flush_min_turns: 4
  nudge_interval: 10
delegation:
  max_iterations: 250
skills:
  creation_nudge_interval: 15
approvals:
  destructive_slash_confirm: false
command_allowlist:
- copy/move file into system config path
- execute_code
- tirith:schemeless_to_sink
- script execution via -e/-c flag
- script execution via heredoc
- stop/restart system service
- tirith:curl_pipe_shell
kanban:
  review_dispatch: true
code_execution:
  max_tool_calls: 50
  timeout: 180
streaming:
  enabled: false
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 49
group_sessions_per_user: true
known_builtin_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - file
  - homeassistant
  - image_gen
  - memory
  - session_search
  - skills
  - spotify
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
  telegram:
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - file
  - homeassistant
  - image_gen
  - memory
  - session_search
  - skills
  - spotify
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
known_plugin_toolsets:
  cli:
  - spotify
  telegram:
  - spotify
platform_toolsets:
  cli:
  - kanban
  - file
  - terminal
  - code_execution
  - skills
  - memory
  - web
  discord:
  - hermes-discord
  google_chat:
  - hermes-google_chat
  homeassistant:
  - hermes-homeassistant
  qqbot:
  - hermes-qqbot
  signal:
  - hermes-signal
  slack:
  - hermes-slack
  teams:
  - hermes-teams
  telegram:
  - connections
  - file
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - terminal
  - vision
  whatsapp:
  - hermes-whatsapp
  yuanbao:
  - hermes-yuanbao
session_reset:
  at_hour: 4
  idle_minutes: 1440
  mode: none
cloud_provider:
  inactivity_timeout: 300
platforms:
  telegram:
    enabled: false
    home_channel:
      platform: telegram
      chat_id: "${TELEGRAM_HOME_CHAT_ID}"
      name: Sakluma Original
      user_id: "${TELEGRAM_HOME_USER_ID}"
mcp_servers:
  google-maps:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-google-maps'
    env:
      key_env: GOOGLE_MAPS_API_KEY
    enabled: true
  comfy-cloud:
    url: https://cloud.comfy.org/mcp
    auth: oauth
    enabled: true
    tools:
      include:
      - search_templates
      - get_template
      - get_template_schema
      - search_models
      - search_nodes
      - get_node
      - get_prompting_guide
      - run_template
      - submit_workflow
      - partner_generate
      - upload_file
      - apply_slots
      - get_job_status
      - wait_for_job
      - get_output
      - use_previous_output
      - cancel_job
      - get_queue
      - get_billing_status
      - get_workflow_canvas_url
plugins:
  enabled:
  - obc35-mutation-guard
  disabled: []
  entries:
    obc35-mutation-guard:
      allow_tool_override: true
  agentmemory:
    command: /home/ubuntu/.local/bin/node
    args:
    - /home/ubuntu/.npm/_npx/a3c27f3e65e46bc3/node_modules/@agentmemory/agentmemory/dist/standalone-BqNJDJ04.mjs
    env:
      AGENTMEMORY_URL: http://127.0.0.1:3111
    enabled: true
providers:
  byteplus: &id001
    name: byteplus
    base_url: https://ark.ap-southeast.bytepluses.com/api/coding/v3
    key_env: BYTEPLUS_API_KEY
    api_key: "${BYTEPLUS_API_KEY}"
    model: ark-code-latest
    api_mode: chat_completions
    rate_limit_delay: 1.5
    models:
    - ark-code-latest
    - deepseek-v4-pro-ga-260813
    - deepseek-v4-1-flash-260910
    - seed-2-0-code-preview-260328
  google-paid: &id002
    name: google-paid
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GEMINI_API_KEY_PAID
    api_mode: chat_completions
    model: gemini-3.8-flash
    models:
    - gemini-3.8-flash
    - gemini-3-flash-preview
    - gemini-2.5-flash-lite
custom_providers:
- *id001
- *id002
auxiliary:
  vision:
    provider: openrouter
    model: google/gemini-2.5-flash
    timeout: 60
    download_timeout: 30
